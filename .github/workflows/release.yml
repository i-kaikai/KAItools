name: Release Web

# Gitee 推送 master -> GitHub 镜像同步 -> 本工作流自动执行。
# 不使用手动 tag；每个 master 提交都会产生一个可追踪的版本目录。
on:
  push:
    branches:
      - master

# 部署凭据通过 production Environment Secrets 注入，不需要写仓库权限。
permissions:
  contents: read

# 生产发布串行执行，避免两个提交同时切换 current 符号链接。
concurrency:
  group: kaitools-web-production
  cancel-in-progress: false

jobs:
  build:
    name: Build release artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      artifact_name: ${{ steps.package.outputs.artifact_name }}
      release_id: ${{ steps.package.outputs.release_id }}
    defaults:
      run:
        shell: bash

    steps:
      # 构建 Job 只负责验证和打包，不接触生产服务器。
      - name: Check out master commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      # 发布前重新验证当前 master；不能直接复用过期 CI 制品。
      - name: Install and verify frontend
        working-directory: frontend
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile --config.confirmModulesPurge=false
          corepack pnpm typecheck
          corepack pnpm test
          corepack pnpm build:web

      # release_id 同时写入 Job output、制品名和服务器目录，便于回滚定位。
      - name: Package browser artifact
        id: package
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          release_id="web-v$(tr -d '\r\n' < VERSION)-${COMMIT_SHA:0:12}"
          archive="${RUNNER_TEMP}/kaitools-web-${release_id}.tar.gz"
          tar -C build/web -czf "$archive" .
          test -s "$archive"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
          echo "artifact_name=kaitools-web-release-${release_id}" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      # build 和 deploy 之间通过 GitHub Actions artifact 传递压缩包。
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: Deploy production web
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # 进入 Environment 后才能读取生产 Secrets；required reviewers 会在这里暂停。
    environment: production
    defaults:
      run:
        shell: bash

    steps:
      # 部署 Job 使用同一触发提交中的脚本，并下载 build Job 生成的制品。
      - name: Check out deployed commit
        uses: actions/checkout@v4

      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: release-artifact

      # known_hosts 必须由用户预先核验，工作流不会执行不安全的 ssh-keyscan。
      - name: Configure deployment SSH client
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for required in DEPLOY_SSH_PRIVATE_KEY DEPLOY_SSH_KNOWN_HOSTS; do
            [[ -n "${!required:-}" ]] || { echo "Missing required production secret: $required" >&2; exit 1; }
          done
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      # 远程脚本先上传到新版本目录，再原子切换 current；公网健康检查失败会回滚。
      - name: Upload and activate browser release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          WEB_RELEASES_DIR: ${{ secrets.WEB_RELEASES_DIR }}
          WEB_HEALTH_URL: ${{ secrets.WEB_HEALTH_URL }}
          RELEASE_ID: ${{ needs.build.outputs.release_id }}
        run: |
          set -euo pipefail
          for required in DEPLOY_HOST DEPLOY_USER DEPLOY_PORT WEB_RELEASES_DIR WEB_HEALTH_URL RELEASE_ID; do
            [[ -n "${!required:-}" ]] || { echo "Missing required production secret: $required" >&2; exit 1; }
          done
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]] || { echo "DEPLOY_PORT must be a valid port" >&2; exit 1; }
          target="$DEPLOY_USER@$DEPLOY_HOST"
          releases_b64="$(printf '%s' "$WEB_RELEASES_DIR" | base64 -w 0)"
          remote_archive="$(ssh -p "$DEPLOY_PORT" -i "$HOME/.ssh/id_ed25519" "$target" "release_dir=\$(printf '%s' '$releases_b64' | base64 --decode); mkdir -p -- \"\$release_dir/.incoming\"; printf '%s/.incoming/%s.tar.gz' \"\$release_dir\" '$RELEASE_ID'")"
          archive="$(find release-artifact -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          test -n "$archive"
          scp -P "$DEPLOY_PORT" -i "$HOME/.ssh/id_ed25519" "$archive" "$target:$remote_archive"
          archive_b64="$(printf '%s' "$remote_archive" | base64 -w 0)"
          ssh -p "$DEPLOY_PORT" -i "$HOME/.ssh/id_ed25519" "$target" "export KAITOOLS_RELEASES_DIR=\$(printf '%s' '$releases_b64' | base64 --decode); export KAITOOLS_RELEASE_ID='$RELEASE_ID'; export KAITOOLS_ARCHIVE=\$(printf '%s' '$archive_b64' | base64 --decode); bash -s deploy" < scripts/deploy-web.sh
          if ! curl --fail --show-error --silent --retry 5 --retry-delay 2 --retry-all-errors "$WEB_HEALTH_URL" > /dev/null; then
            ssh -p "$DEPLOY_PORT" -i "$HOME/.ssh/id_ed25519" "$target" "export KAITOOLS_RELEASES_DIR=\$(printf '%s' '$releases_b64' | base64 --decode); bash -s rollback" < scripts/deploy-web.sh
            exit 1
          fi

  desktop:
    name: Build and publish desktop update
    runs-on: windows-2022
    timeout-minutes: 45
    environment: production
    outputs:
      artifact_name: ${{ steps.package.outputs.artifact_name }}
      release_id: ${{ steps.package.outputs.release_id }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      archive_sha256: ${{ steps.package.outputs.archive_sha256 }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out master commit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: |
          corepack enable
          Push-Location frontend
          corepack pnpm install --frozen-lockfile --config.confirmModulesPurge=false
          Pop-Location
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r requirements-dev.txt
          .\scripts\check_build_tools.ps1 -PythonPath .\.venv\Scripts\python.exe

      - name: Validate release metadata
        run: |
          .\scripts\check_version.ps1
          .\scripts\check_release_notes.ps1

      - name: Write signing key to runner temporary storage
        env:
          KAITOOLS_UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.KAITOOLS_UPDATE_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:KAITOOLS_UPDATE_SIGNING_PRIVATE_KEY)) { throw 'Missing KAITOOLS_UPDATE_SIGNING_PRIVATE_KEY' }
          $keyPath = Join-Path $env:RUNNER_TEMP 'kaitools-update-signing-key.pem'
          [System.IO.File]::WriteAllText($keyPath, $env:KAITOOLS_UPDATE_SIGNING_PRIVATE_KEY, [System.Text.UTF8Encoding]::new($false))
          "KAITOOLS_UPDATE_KEY_PATH=$keyPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build and verify desktop update artifacts
        run: |
          .\scripts\build_portable.ps1 -SkipE2E -SigningKeyPath $env:KAITOOLS_UPDATE_KEY_PATH
          .\.venv\Scripts\python.exe .\scripts\verify_update_release.py --updates-root .\release\updates --public-key .\packaging\update-public-key.pem

      - name: Package desktop update artifact
        id: package
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          $version = (Get-Content VERSION -Raw -Encoding UTF8).Trim()
          $releaseId = "desktop-v$version-$($env:RELEASE_SHA.Substring(0, 12))"
          $archive = Join-Path $env:RUNNER_TEMP "kaitools-desktop-updates-$releaseId.tar.gz"
          tar -C .\release\updates -czf $archive .
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $archive)) { throw 'Desktop update artifact packaging failed' }
          $archiveSha256 = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "release_id=$releaseId" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "artifact_name=kaitools-desktop-release-$releaseId" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "archive_sha256=$archiveSha256" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "archive=$archive" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload desktop update artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error
          retention-days: 30

  desktop-deploy:
    name: Publish desktop update from Linux
    needs: desktop
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: production
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out deployment script
        uses: actions/checkout@v4

      # 保存上一版公开元数据及签名；验签脚本会重新验证它们，不能信任未认证的路径提示。
      - name: Capture previous public update metadata
        id: previous_update
        run: |
          set -euo pipefail
          previous_dir="$RUNNER_TEMP/kaitools-previous-update"
          install -d -m 700 "$previous_dir"
          latest="$previous_dir/latest.json"
          signature="$previous_dir/latest.json.sig"
          if curl --fail --silent --show-error --retry 3 --retry-delay 2 --retry-all-errors --output "$latest" https://tools.imkai.top/downloads/kaitools/latest.json \
            && curl --fail --silent --show-error --retry 3 --retry-delay 2 --retry-all-errors --output "$signature" https://tools.imkai.top/downloads/kaitools/latest.json.sig; then
            echo "Captured previous public update metadata."
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "No usable previous public metadata; public verification will be full." >&2
            rm -f -- "$latest" "$signature"
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure deployment SSH client
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for required in DEPLOY_SSH_PRIVATE_KEY DEPLOY_SSH_KNOWN_HOSTS; do
            [[ -n "${!required:-}" ]] || { echo "Missing required production secret: $required" >&2; exit 1; }
          done
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Pull and activate desktop update on the server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          KAITOOLS_UPDATE_ROOT: ${{ secrets.KAITOOLS_UPDATE_ROOT }}
          RELEASE_ID: ${{ needs.desktop.outputs.release_id }}
          ARTIFACT_ID: ${{ needs.desktop.outputs.artifact_id }}
          ARCHIVE_SHA256: ${{ needs.desktop.outputs.archive_sha256 }}
          GITHUB_REPOSITORY_NAME: ${{ github.repository }}
        run: |
          set -euo pipefail
          for required in DEPLOY_HOST DEPLOY_USER DEPLOY_PORT KAITOOLS_UPDATE_ROOT RELEASE_ID ARTIFACT_ID ARCHIVE_SHA256 GITHUB_REPOSITORY_NAME; do
            [[ -n "${!required:-}" ]] || { echo "Missing required production secret: $required" >&2; exit 1; }
          done
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]] || { echo "DEPLOY_PORT must be numeric" >&2; exit 1; }
          [[ "$KAITOOLS_UPDATE_ROOT" =~ ^/[^[:space:]]+$ ]] || { echo "KAITOOLS_UPDATE_ROOT must be an absolute path without spaces" >&2; exit 1; }
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]] || { echo "ARTIFACT_ID must be numeric" >&2; exit 1; }
          [[ "$ARCHIVE_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "ARCHIVE_SHA256 must be a lowercase SHA-256 digest" >&2; exit 1; }
          [[ "$GITHUB_REPOSITORY_NAME" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo "GITHUB_REPOSITORY_NAME is invalid" >&2; exit 1; }
          target="$DEPLOY_USER@$DEPLOY_HOST"
          releases_b64="$(printf '%s' "$KAITOOLS_UPDATE_ROOT" | base64 -w 0)"
          ssh -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=120 -p "$DEPLOY_PORT" -i "$HOME/.ssh/id_ed25519" "$target" "export KAITOOLS_UPDATE_ROOT=\$(printf '%s' '$releases_b64' | base64 --decode); export KAITOOLS_UPDATE_RELEASE_ID='$RELEASE_ID'; export KAITOOLS_GITHUB_ARTIFACT_ID='$ARTIFACT_ID'; export KAITOOLS_GITHUB_ARTIFACT_SHA256='$ARCHIVE_SHA256'; export KAITOOLS_GITHUB_REPOSITORY='$GITHUB_REPOSITORY_NAME'; bash -s deploy" < scripts/deploy-updates.sh

      - name: Set up Python for public update verification
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Verify published desktop update from the public URL
        env:
          PREVIOUS_UPDATE_AVAILABLE: ${{ steps.previous_update.outputs.available }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements-release.txt
          args=(--remote-latest-url https://tools.imkai.top/downloads/kaitools/latest.json --public-key packaging/update-public-key.pem)
          if [[ "$PREVIOUS_UPDATE_AVAILABLE" = true ]]; then
            args+=(--previous-latest "$RUNNER_TEMP/kaitools-previous-update/latest.json" --previous-latest-signature "$RUNNER_TEMP/kaitools-previous-update/latest.json.sig")
          fi
          python scripts/verify_update_release.py "${args[@]}"

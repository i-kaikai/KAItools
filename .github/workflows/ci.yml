name: Web CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: kaitools-web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify web and desktop sources
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          corepack enable
          pnpm install --frozen-lockfile --config.confirmModulesPurge=false

      - name: Validate version metadata
        shell: pwsh
        run: ./scripts/check_version.ps1

      - name: Run frontend type checks and unit tests
        working-directory: frontend
        run: |
          corepack pnpm typecheck
          corepack pnpm test

      - name: Install Playwright browser
        working-directory: frontend
        run: corepack pnpm exec playwright install --with-deps chromium

      - name: Run desktop-mode browser tests
        working-directory: frontend
        run: corepack pnpm test:e2e

      - name: Build browser distribution
        working-directory: frontend
        run: corepack pnpm build:web

      - name: Run browser-mode end-to-end tests
        working-directory: frontend
        run: corepack pnpm test:e2e:web

      - name: Validate Python sources and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m compileall -q desktop
          python -m pytest

      - name: Upload browser test diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: kaitools-web-test-results-${{ github.run_id }}
          path: |
            frontend/test-results
            frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload browser deployment artifact
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: kaitools-web-build-${{ github.sha }}
          path: build/web
          if-no-files-found: error
          retention-days: 7
